<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hello + 100 sorries</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0b1220;
        --panel: rgba(255, 255, 255, 0.06);
        --text: rgba(255, 255, 255, 0.92);
        --muted: rgba(255, 255, 255, 0.7);
        --accent: #7c5cff;
        --border: rgba(255, 255, 255, 0.12);
      }

      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f6f7fb;
          --panel: rgba(0, 0, 0, 0.04);
          --text: rgba(0, 0, 0, 0.92);
          --muted: rgba(0, 0, 0, 0.65);
          --accent: #4c2fff;
          --border: rgba(0, 0, 0, 0.12);
        }
      }

      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto,
          Arial, "Noto Sans", "Helvetica Neue", sans-serif;
        background: radial-gradient(
            900px 600px at 20% 0%,
            rgba(124, 92, 255, 0.28),
            transparent 60%
          ),
          radial-gradient(
            800px 600px at 90% 20%,
            rgba(0, 214, 255, 0.18),
            transparent 55%
          ),
          var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .card {
        width: min(860px, 100%);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 18px;
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.25);
        padding: 20px;
      }

      header {
        display: flex;
        gap: 12px;
        align-items: baseline;
        justify-content: space-between;
        flex-wrap: wrap;
        margin-bottom: 14px;
      }

      h1 {
        font-size: 18px;
        letter-spacing: 0.2px;
        margin: 0;
      }

      .sub {
        margin: 0;
        font-size: 13px;
        color: var(--muted);
      }

      .controls {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
        margin: 14px 0 16px;
      }

      button {
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.06);
        color: var(--text);
        border-radius: 12px;
        padding: 10px 12px;
        font-weight: 650;
        letter-spacing: 0.2px;
        cursor: pointer;
      }

      button.primary {
        background: linear-gradient(135deg, var(--accent), rgba(124, 92, 255, 0.65));
        border-color: rgba(124, 92, 255, 0.7);
      }

      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      label {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: var(--muted);
        user-select: none;
      }

      input[type="range"] {
        width: 160px;
        accent-color: var(--accent);
      }

      .meta {
        font-size: 13px;
        color: var(--muted);
      }

      .output {
        margin-top: 14px;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: rgba(0, 0, 0, 0.18);
        padding: 14px;
        height: min(52vh, 460px);
        overflow: auto;
      }

      @media (prefers-color-scheme: light) {
        .output {
          background: rgba(255, 255, 255, 0.6);
        }
      }

      .line {
        padding: 6px 8px;
        border-radius: 10px;
        margin: 6px 0;
        border: 1px solid transparent;
        background: rgba(255, 255, 255, 0.04);
      }

      .line.hello {
        border-color: rgba(124, 92, 255, 0.35);
        background: rgba(124, 92, 255, 0.12);
        font-weight: 700;
      }

      .line.sorry {
        background: rgba(255, 255, 255, 0.035);
      }

      .pill {
        display: inline-block;
        font-size: 12px;
        padding: 3px 8px;
        border-radius: 999px;
        border: 1px solid var(--border);
        color: var(--muted);
        margin-left: 8px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <header>
        <div>
          <h1>Hello + 100 sorries</h1>
          <p class="sub">
            Click start to print <strong>Hello Arya Sureeshh</strong>, then print
            <strong>sorry</strong> 100 times.
          </p>
        </div>
        <div class="meta">
          Printed: <span id="count">0</span>/100 <span class="pill" id="state">idle</span>
        </div>
      </header>

      <section class="controls" aria-label="controls">
        <button class="primary" id="startBtn">Start</button>
        <button id="pauseBtn" disabled>Pause</button>
        <button id="resetBtn" disabled>Reset</button>

        <label>
          Speed
          <input id="speed" type="range" min="10" max="600" value="80" />
          <span id="speedLabel">80ms</span>
        </label>
      </section>

      <section class="output" id="output" aria-live="polite" aria-label="output"></section>
    </main>

    <script>
      const output = document.getElementById("output");
      const startBtn = document.getElementById("startBtn");
      const pauseBtn = document.getElementById("pauseBtn");
      const resetBtn = document.getElementById("resetBtn");
      const countEl = document.getElementById("count");
      const stateEl = document.getElementById("state");
      const speed = document.getElementById("speed");
      const speedLabel = document.getElementById("speedLabel");

      let printed = 0;
      let timer = null;
      let running = false;

      function setState(text) {
        stateEl.textContent = text;
      }

      function setCount(n) {
        countEl.textContent = String(n);
      }

      function addLine(text, kind) {
        const div = document.createElement("div");
        div.className = `line ${kind}`;
        div.textContent = text;
        output.appendChild(div);
        output.scrollTop = output.scrollHeight;
      }

      function setButtons() {
        startBtn.disabled = running || printed > 0 || printed >= 100;
        pauseBtn.disabled = !running;
        resetBtn.disabled = output.childElementCount === 0;
      }

      function startPrinting() {
        if (printed > 0 || running) return;

        addLine("Hello Arya Sureeshh", "hello");
        setState("printing");
        running = true;
        setButtons();

        timer = window.setInterval(() => {
          if (printed >= 100) {
            stopPrinting("done");
            return;
          }
          printed += 1;
          setCount(printed);
          addLine("sorry", "sorry");
          if (printed >= 100) stopPrinting("done");
        }, Number(speed.value));
      }

      function stopPrinting(state) {
        if (timer) window.clearInterval(timer);
        timer = null;
        running = false;
        setState(state);
        setButtons();
      }

      function pauseOrResume() {
        if (running) {
          stopPrinting("paused");
          pauseBtn.textContent = "Resume";
          startBtn.disabled = true;
          resetBtn.disabled = false;
          return;
        }

        if (printed === 0 || printed >= 100) return;
        setState("printing");
        running = true;
        pauseBtn.textContent = "Pause";
        setButtons();

        timer = window.setInterval(() => {
          if (printed >= 100) {
            stopPrinting("done");
            return;
          }
          printed += 1;
          setCount(printed);
          addLine("sorry", "sorry");
          if (printed >= 100) stopPrinting("done");
        }, Number(speed.value));
      }

      function resetAll() {
        if (timer) window.clearInterval(timer);
        timer = null;
        running = false;
        printed = 0;
        setCount(0);
        setState("idle");
        pauseBtn.textContent = "Pause";
        output.replaceChildren();
        setButtons();
      }

      speed.addEventListener("input", () => {
        speedLabel.textContent = `${speed.value}ms`;
        if (running) {
          stopPrinting("paused");
          pauseBtn.textContent = "Resume";
        }
      });

      startBtn.addEventListener("click", startPrinting);
      pauseBtn.addEventListener("click", pauseOrResume);
      resetBtn.addEventListener("click", resetAll);

      speedLabel.textContent = `${speed.value}ms`;
      setButtons();
    </script>
  </body>
</html>
